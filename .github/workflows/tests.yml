# push／PR 時自動跑 pytest。測試全部離線（外部資料都以假資料取代），不需要 FinMind token。
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"          # 與本機 .venv-mcp 相同
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: 安裝套件
        run: pip install -r requirements-dev.txt

      - name: 執行測試
        env:
          DISABLE_DISK_MEMO: "1"          # 不讀寫 .cache/memo/
        run: python -m pytest -q
